#
# Put the Mastodon client API of Nextcloud Social at the root of the domain.
#
# A Mastodon app is given a domain and builds https://<domain>/api/v1/... from
# it. None of them accept a path, so without these rules the app cannot add an
# account here at all. The web interface and federation with other servers do
# not need them.
#
# Include this from the <VirtualHost> that serves Nextcloud. It cannot go in an
# .htaccess file: ProxyPreserveHost is not allowed there, and without it the
# app sees Host: 127.0.0.1 and refuses the request as an untrusted domain.
#
# Needs mod_proxy, mod_proxy_http and mod_rewrite.
#
# Adjust the /index.php prefix if this instance serves Nextcloud from a
# subdirectory: /cloud/index.php, and so on, and the upstream address if this
# server does not answer plain HTTP on 127.0.0.1:80.
#
# These requests arrive from 127.0.0.1 afterwards, so add that to
# `trusted_proxies` in config.php; without it every client shares one address
# for rate limiting, brute-force protection and the log. mod_proxy already
# sends the client's own address along in X-Forwarded-For.

ProxyPreserveHost On

<IfModule mod_rewrite.c>
    RewriteEngine On

    # The client API and the OAuth endpoints an app talks to.
    #
    # [P] rather than a plain rewrite, and not a redirect. Nextcloud builds the
    # route from REQUEST_URI, which an internal rewrite does not change, so a
    # plain rewrite reaches PHP but not the route and answers 404. A redirect
    # does reach the route, but many HTTP clients drop the Authorization header
    # when they follow one, so every signed-in request then answers 401.
    #
    # `^/?` on purpose: inside <VirtualHost> the path still has its leading
    # slash and inside a <Directory> it does not.
    RewriteRule ^/?api/(.*)$   http://127.0.0.1/index.php/apps/social/api/$1   [P,QSA,L]
    RewriteRule ^/?oauth/(.*)$ http://127.0.0.1/index.php/apps/social/oauth/$1 [P,QSA,L]

    # Discovery. webfinger and nodeinfo are already redirected by Nextcloud's
    # own rules; host-meta is not, and some clients ask for it first.
    RewriteRule ^/?\.well-known/host-meta$ http://127.0.0.1/index.php/.well-known/host-meta [P,QSA,L]

    # An app sends its bearer token in the Authorization header. Apache does not
    # hand that to PHP on every setup, and without it every request from a
    # signed-in app answers 401.
    RewriteCond %{HTTP:Authorization} ^(.+)$
    RewriteRule .* - [env=HTTP_AUTHORIZATION:%1]
</IfModule>
