version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: saturday
    time: "03:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 10
  cooldown:
    default-days: 10
    exclude:
      - "@nextcloud/*"
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: weekly
    day: saturday
    time: "03:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 10
  cooldown:
    default-days: 10
    exclude:
      - "nextcloud/*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: saturday
    time: "03:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 10
  cooldown:
    default-days: 10
    exclude:
      - "nextcloud/*"
      - "nextcloud-libraries/*"
      - "nextcloud-releases/*"
  groups:
    github-actions:
      patterns:
        - "*"
