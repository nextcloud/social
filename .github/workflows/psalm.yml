name: Static analysis

permissions:
  contents: read

on: pull_request

concurrency:
  group: psalm-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    name: static-psalm-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up php8.3
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231 # v2.31.1
        with:
          php-version: 8.3
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer i

      # No friendica/json-ld patch here: since 1.1.5 jsonld.php guards
      # $http_response_header behind function_exists('http_get_last_response_headers'),
      # so the PHP 8.4 fatal this job used to sed away no longer exists. Adding a
      # patch step in CI that nothing else applies is how CI and a local run drift
      # apart, so if the dependency regresses, fix it in composer.json, not here.

      # Runs against tests/psalm-baseline.xml and FAILS on anything new.
      # Accepting a new baseline is a deliberate act: run
      # `composer run psalm:update-baseline` locally and commit the result.
      - name: Run Psalm static analysis
        run: php vendor/bin/psalm --threads=1
