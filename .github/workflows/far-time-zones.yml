#
# The unit suites pin themselves to UTC, so code that reads the local time
# zone where it should not passes them on any runner. Weekly, they run once
# more in two zones far from UTC — UTC+14, where a date is a day ahead of UTC
# for most of it, and the US west coast with its daylight saving switch —
# through SOCIAL_TEST_TZ, which tests/bootstrap.php and vitest.config.js put
# in place of the pin.

name: Unit tests in far time zones

on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 4'
  # the `full-ci` label (labelled-ci.yml)
  workflow_call:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        time-zone: ['Pacific/Kiritimati', 'America/Los_Angeles']

    name: PHPUnit in ${{ matrix.time-zone }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up php8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.3
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up dependencies
        run: composer i

      - name: PHPUnit
        env:
          SOCIAL_TEST_TZ: ${{ matrix.time-zone }}
        run: composer run test:unit

  vitest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        time-zone: ['Pacific/Kiritimati', 'America/Los_Angeles']

    name: Vitest in ${{ matrix.time-zone }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          fallbackNode: '^20'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm ci

      - name: Test
        env:
          SOCIAL_TEST_TZ: ${{ matrix.time-zone }}
        run: npm test
