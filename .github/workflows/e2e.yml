#
# The browser tests: a throwaway Nextcloud with this app installed, driven by
# Playwright the way a person would drive it. The unit and integration suites
# cannot see a page that stays empty; this can. See tests/e2e/.
#
# A pull request runs the two legs that decide most: both server versions
# info.xml names at the top, on SQLite, in Chromium. A push to master, the
# weekly run and a manual run add the slower legs: the oldest server info.xml
# claims (34), PostgreSQL, and the smoke spec in Firefox.

name: Browser tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * 3'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  legs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
      # The pages this drives are built from the server's own layout and CSS
      # variables, which is exactly what a major server version changes, so
      # one version cannot stand in for another: `master` is Nextcloud 36
      # until it branches off as stable36, and 34 is the floor info.xml
      # claims. PostgreSQL is the database most production instances run;
      # Firefox draws and lays out with an engine of its own.
      - name: Pick the legs
        id: legs
        env:
          EVENT: ${{ github.event_name }}
        run: |
          legs='[
            {"server": "stable35", "db": "sqlite", "browser": "chromium", "guests": true},
            {"server": "master", "db": "sqlite", "browser": "chromium"}
          ]'
          if [ "$EVENT" != pull_request ]; then
            legs=$(echo "$legs" | jq '. + [
              {"server": "stable34", "db": "sqlite", "browser": "chromium"},
              {"server": "stable35", "db": "pgsql", "browser": "chromium"},
              {"server": "stable35", "db": "sqlite", "browser": "firefox"}
            ]')
          fi
          echo "matrix=$(echo "$legs" | jq -c '{include: .}')" | tee -a "$GITHUB_OUTPUT"

  e2e:
    runs-on: ubuntu-latest
    needs: legs

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.legs.outputs.matrix) }}

    name: Playwright against Nextcloud ${{ matrix.server }} on ${{ matrix.db }} in ${{ matrix.browser }}

    steps:
      - name: Set app env
        run: echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server }}

      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: apps/${{ env.APP_NAME }}

      - name: Checkout the Guests app for the compatibility run
        if: matrix.guests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nextcloud/guests
          ref: v4.9.0
          path: apps/guests

      - name: Set up php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite, pgsql, pdo_pgsql
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start PostgreSQL
        # the image phpunit-pgsql.yml uses
        if: matrix.db == 'pgsql'
        run: |
          docker run -d --name db -p 4444:5432 \
            -e POSTGRES_USER=root -e POSTGRES_PASSWORD=rootpassword -e POSTGRES_DB=nextcloud \
            ghcr.io/nextcloud/continuous-integration-postgres-14:latest
          for attempt in $(seq 1 60); do
            docker exec db pg_isready -U root >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs db
          exit 1

      - name: Set up Guests PHP dependencies
        if: matrix.guests
        working-directory: apps/guests
        run: composer i --no-dev

      - name: Set up the app's PHP dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: composer i --no-dev

      - name: Set up Nextcloud
        env:
          OC_PASS: Browser-Test-2026!
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=${{ matrix.db }} --database-name=nextcloud --database-host=127.0.0.1 --database-port=4444 --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          ./occ app:enable --force ${{ env.APP_NAME }}
          if [ "${{ matrix.guests }}" = "true" ]; then
            ./occ app:enable --force guests
            ./occ config:app:set guests usewhitelist --value yes --type boolean
            # Start without Social allowed; the browser test verifies the real 403,
            # then enables Social and verifies normal access for the Guests user.
            ./occ config:app:set guests whitelist --value files
            OC_PASS="$OC_PASS" ./occ guests:add admin guest@example.org --uid=guest --password-from-env --display-name "Guest account"
          fi
          # a second account and a group, so the group list has somebody in it
          ./occ user:add --password-from-env --display-name "Bob" bob
          ./occ group:add design
          ./occ group:adduser design admin
          ./occ group:adduser design bob
          # a Nextcloud group becomes a Social list only where an administrator
          # has chosen it; the smoke test walks that list, so it is chosen here
          ./occ config:app:set social group_lists --value '["design"]'
          ./occ config:system:set trusted_domains 1 --value localhost:8080
          ./occ config:system:set overwrite.cli.url --value http://localhost:8080
          # the app's own idea of where it lives; the setup page writes these on
          # a real instance, and everything from actor creation to a timeline
          # read throws without them (tests/Integration/bootstrap.php does the same)
          ./occ config:app:set social cloud_url --value http://localhost:8080
          ./occ config:app:set social social_url --value http://localhost:8080/index.php/apps/social/
          # the instance has to be allowed to talk to itself: with the built-in
          # server it is `localhost`, which the HTTP client refuses by default
          ./occ config:system:set allow_local_remote_servers --value true --type boolean
          # a hashtag the search test can find: search reads the hashtag
          # table the twelve-minute cron fills, and no cron runs here
          ./occ social:account:create admin
          ./occ social:note:create -q admin 'Seeded for the search test #alohasearch'
          ./occ social:cache:refresh

      - name: Run Nextcloud
        # several workers, not the default one: rendering the app makes the
        # server fetch its own avatar route over HTTP, and a single-worker
        # built-in server deadlocks on that until the ten-second timeout, so
        # every page came out as a 500
        run: PHP_CLI_SERVER_WORKERS=8 php -S localhost:8080 &

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          path: apps/${{ env.APP_NAME }}
          fallbackNode: '^20'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Install the test runner
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Browser tests
        working-directory: apps/${{ env.APP_NAME }}
        env:
          E2E_BASE_URL: http://localhost:8080
          # not the admin: for an admin the app first runs its setup check, and
          # the WebFinger probe cannot pass behind PHP's built-in server (no
          # .well-known rewrite), so the admin would see the setup page and no
          # sidebar. A plain account gets the app.
          E2E_USER: bob
          E2E_PASSWORD: Browser-Test-2026!
          E2E_GROUP: design
          E2E_GUEST: ${{ matrix.guests && 'guest' || '' }}
          # another engine runs the smoke spec only (playwright.config.mjs)
          E2E_BROWSERS: ${{ matrix.browser != 'chromium' && matrix.browser || '' }}
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          # per leg: two jobs uploading one name is an error
          name: playwright-report-${{ matrix.server }}-${{ matrix.db }}-${{ matrix.browser }}
          # relative to the config file, tests/e2e/playwright.config.mjs
          path: |
            apps/${{ env.APP_NAME }}/tests/e2e/playwright-report
            apps/${{ env.APP_NAME }}/tests/e2e/test-results
          retention-days: 7

      - name: Print the server log
        if: failure()
        run: cat data/nextcloud.log
