# Frontend unit tests (Vitest). Structure mirrors the organisation's lint-eslint
# template so branch protection can key on the summary job name.
#
# SPDX-FileCopyrightText: 2026 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: Frontend unit tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - stable*

permissions:
  contents: read

concurrency:
  group: vitest-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src}}

    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/**'
              - 'src/**'
              - 'tests/js/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vitest.config.js'
              - '**.js'
              - '**.vue'

  test:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false'

    name: NPM test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          fallbackNode: '^20'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm ci

      - name: Test
        # with coverage: vitest.config.js holds the thresholds this fails under
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/js/coverage-summary.json ] || exit 0
          node -e '
            const total = require("./coverage/js/coverage-summary.json").total
            const rows = ["lines", "statements", "branches", "functions"]
              .map((key) => `| ${key} | ${total[key].pct} % | ${total[key].covered} | ${total[key].total} |`)
            console.log(["### JS coverage (src/)", "", "| | % | Covered | Of |", "|---|---:|---:|---:|", ...rows].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: js-coverage
          path: coverage/js
          if-no-files-found: ignore
          retention-days: 14

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, test]

    if: always()

    name: vitest

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.test.result != 'success' }}; then exit 1; fi
