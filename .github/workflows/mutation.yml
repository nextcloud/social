#
# Mutation testing of the trust-critical code: signature verification, the
# viewer's audience in queries and in the post model, the atproto OAuth
# server, DPoP and service auth, the account cascade, the address classifier
# and the outbound request guard. A test that passes whatever that code does
# is worse than none, and only a mutant shows it. Nightly, because one run
# takes the whole unit suite with coverage and then a run per mutant; the
# score has to stay above minMsi in infection.json5, and the report of what
# survived is kept as an artifact.

name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read

jobs:
  infection:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    name: Infection on the trust-critical classes

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up php8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.3
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: pcov
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up dependencies
        run: composer i

      - name: Infection
        run: composer run test:mutation

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: infection-report
          path: build/infection/
          if-no-files-found: ignore
          retention-days: 14
