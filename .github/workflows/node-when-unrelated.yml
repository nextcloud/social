# The skip half of the pair: node.yml runs the real build (and checks the
# committed js/ bundle against src/) and ends in a summary job named `node`.
# This workflow reports the same `node` check on pull requests that touch no
# frontend file, so a branch-protection rule on `node` is satisfied either way.
#
# Keep the paths-ignore list here identical to the `src` filter in node.yml.
#
# This workflow is provided via the organization template repository
#
# https://github.com/nextcloud/.github
# https://docs.github.com/en/actions/learn-github-actions/sharing-workflows-with-your-organization
#
# SPDX-FileCopyrightText: 2021-2024 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: Node

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/**'
      - 'src/**'
      - 'js/**'
      - 'appinfo/info.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'webpack.*.js'
      - 'babel.config.js'
      - '**.js'
      - '**.ts'
      - '**.vue'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: none

    runs-on: ubuntu-latest

    name: node
    steps:
      - name: Skip
        run: 'echo "No JS/TS files changed, skipped Node"'
