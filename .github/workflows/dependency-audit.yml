#
# Known vulnerabilities in the dependencies the lock files pin: every composer
# package, and the npm packages that are bundled into js/. npm's dev-only
# packages are left out: they build the bundle and never reach a server.
#
# Nightly, by hand, and on a pull request labelled `full-ci`
# (labelled-ci.yml): an advisory published today makes a lock file nobody
# changed vulnerable, so the nightly run is what notices, whether or not a
# pull request touched a lock file. Both audits read only the lock files, so
# nothing is installed.

name: Dependency audit

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '47 21 * * *'

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  composer:
    runs-on: ubuntu-latest
    name: composer audit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up php8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.3
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit composer.lock
        run: composer audit --locked

  npm:
    runs-on: ubuntu-latest
    name: npm audit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4
        id: versions
        with:
          fallbackNode: '^20'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Audit package-lock.json
        run: npm audit --omit=dev --audit-level=high
